[package]
name = "dramadist"
version = "0.1.0"
description = "DramaDist - 短剧切片分发工作台"
authors = ["DramaDist"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", features = ["multipart", "json"] }
# 完成通知邮件：只用到发信（SMTP），QQ / 163 / Gmail 都是这一套。
# 用 native-tls，和 reqwest 复用同一套系统 TLS。
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-native-tls",
] }
# time: 异步 sleep（轮询生图任务、下载重试等）；sync: 下载并发限流；rt: JoinSet 等任务原语
tokio = { version = "1", features = ["time", "sync", "rt"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# 关掉 WebView2 的「浏览器行为」：右键菜单、F5 刷新、Ctrl+F 查找、缩放、
# 开发者工具。版本跟着 tauri 自己依赖的那份走（见 Cargo.lock）。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[lib]
name = "dramadist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
